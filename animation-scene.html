<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
        <title>Radioactive Signals</title>
    </head>
    <body>
        <a-scene>
            <!-- Set the sky -->
            <a-sky color="blue"></a-sky>

        </a-scene>
    </a-sphere color="orange" 
    position: 0 10 45; height: 2;
    animation="
    property: rotation;
    Rotation: 0 360 45;
    from: 0 10 45;
    to: 0 20 50;
    dur: 3000;
    loop: true;
    dir:alternate;
    "
    >
    </sphere> 
    
    </body>
</html>
